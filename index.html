<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="./funks.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <button>Promoções</button>
            <button>Serviço</button>
            <button>Contato</button>
        </nav>
    </header>
    <main>
        <section class="carrossel">
            <div class="display-carrossel">
                <img class="banner_img" src="./assets/imgscarrossel/1.png" alt="Banner 1">
                <img class="banner_img" src="./assets/imgscarrossel/2.png" alt="Banner 2">
                <img class="banner_img" src="./assets/imgscarrossel/3.png" alt="Banner 3">
            </div>
        </section>
        <section class="content">
            <aside>
                <p>Cortes dos clientes</p>
                <div class="display-cortes">
                    <img class="cliente_img" src="./assets/imgsclientes/1.png" alt="cliente1">
                    <img class="cliente_img" src="./assets/imgsclientes/3.png" alt="cliente3">
                    <img class="cliente_img" src="./assets/imgsclientes/2.png" alt="cliente2">
                </div>
            </aside>
            <section class="display_principal">
                <p>Promoções</p>
                <div class="display_main_promocoes">
                    <div class="card_produto">
                        <div class="img_produto"></div>
                        <span class="titulo_produto">Shampoo 2 muito bom bom pa diaxo</span>
                        <p class="preco_original">R$1000</p>
                        <p class="preco_atual"><span>R$</span>295,69</p>
                        <p class="percentual_desconto">29,57% De desconto!</p>
                        <span class="avaliacao_produto">⭐4.7</span>
                    </div>
                </div>
                
            </section>
            
            <div class="zapzap">
                <img class="conversar_zap" src="assets/outro/image.png" alt="Contato Zap">
                <div class="campo_conversas_zap">
                    <div class="tela_conversas">
                        <span class="mensagem_nossa">Qual a boa Chefe?</span>
                        <span class="sua_mensagem">Chefe?</span>
                    </div>
                    <div class="envio_mensagem">
                        <form action="#">
                            <input type="text" placeholder="envie sua mensagem">
                        </form>
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8.87038 6.13264L14.7327 4.19538C18.033 3.10476 19.6831 2.55945 20.5579 3.43426C21.4327 4.30907 20.8874 5.95922 19.7968 9.25953L17.8595 15.1218C16.6236 18.8619 16.0056 20.7319 14.8796 20.9603C14.6411 21.0087 14.3955 21.0129 14.1549 20.9727C13.019 20.7832 12.3132 18.9359 10.9016 15.2413C10.6328 14.5376 10.4983 14.1858 10.2574 13.9127C10.2018 13.8497 10.1424 13.7903 10.0795 13.7348C9.80638 13.4938 9.45455 13.3594 8.75089 13.0906C5.05627 11.679 3.20896 10.9732 3.01945 9.83727C2.97931 9.59669 2.98353 9.35108 3.03189 9.11259C3.26025 7.98657 5.13029 7.36859 8.87038 6.13264Z" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12.8008 11.1865L15.498 8.48926" stroke="#141B34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>Desenvolvido por: <a href="">VitorP</a></p>
    </footer>
</body>
</html>
